name: Sign iOS Shortcut

on:
  push:
    paths:
      - "shortcut/AI_Text_Hub_unsigned.shortcut"
      - ".github/workflows/sign-shortcut.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign Shortcut with Apple shortcuts CLI
        run: |
          shortcuts sign \
            --mode anyone \
            --input shortcut/AI_Text_Hub_unsigned.shortcut \
            --output shortcut/AI_Text_Hub.shortcut
          ls -lh shortcut/AI_Text_Hub.shortcut

      - name: Upload signed shortcut artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Text_Hub_signed
          path: shortcut/AI_Text_Hub.shortcut

      - name: Commit signed shortcut back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortcut/AI_Text_Hub.shortcut
          if ! git diff --cached --quiet; then
            git commit -m "Sign AI_Text_Hub.shortcut via macOS runner"
            git push
          fi
